[package]
name = "hjlix"
authors = ["Nico"]
version = "0.1.4-1"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.1"
sha3 = "0.12.0"
hex = "0.4"
aes-gcm = { version = "0.11", features = ["getrandom"] }
anyhow = "1.0.104"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true